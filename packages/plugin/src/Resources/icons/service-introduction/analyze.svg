<svg xmlns="http://www.w3.org/2000/svg" width="240" height="110" viewBox="0 0 240 110"><style>.ff-art-analyze-arrow{animation:ff-art-analyze 8s ease-in-out infinite}.ff-art-analyze-line{stroke-dasharray:60;stroke-dashoffset:0;animation:ff-art-analyze-first 8s ease-in-out infinite}.ff-art-analyze-line.second{animation-name:ff-art-analyze-second}.ff-art-analyze-summary{transform-box:fill-box;transform-origin:left center;animation:ff-art-analyze-last 8s ease-in-out infinite}@keyframes ff-art-analyze{0%,65%,100%{transform:translateX(0);opacity:.65}15%,30%{transform:translateX(4px);opacity:1}}@keyframes ff-art-analyze-first{0%,12%{stroke-dashoffset:60;opacity:0}30%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}@keyframes ff-art-analyze-second{0%,26%{stroke-dashoffset:60;opacity:0}44%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}@keyframes ff-art-analyze-last{0%,42%{transform:scaleX(0);opacity:0}57%,85%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}@media(prefers-reduced-motion:reduce){.ff-art-analyze-arrow,.ff-art-analyze-line,.ff-art-analyze-summary{animation:none}}.ff-art-analyze-spark{transform-box:fill-box;transform-origin:center;opacity:0;animation:ff-art-analyze-spark1 8s ease-in-out infinite}.ff-art-analyze-spark.second{animation-name:ff-art-analyze-spark2}@keyframes ff-art-analyze-spark1{0%,24%,65%,100%{opacity:0;transform:scale(.5)}36%,48%{opacity:.85;transform:scale(1)}}@keyframes ff-art-analyze-spark2{0%,45%,85%,100%{opacity:0;transform:scale(.5)}56%,68%{opacity:.8;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.ff-art-analyze-spark{animation:none;opacity:.7}}</style><g transform="translate(-11 0)"><g fill="#fff" stroke="#cbd8e8" stroke-width="1.5"><rect x="12" y="15" width="88" height="80" rx="8"/><rect x="140" y="27" width="88" height="56" rx="8"/></g><g stroke="#b5c6d9" stroke-width="3" stroke-linecap="round"><path d="M27 32h56M27 44h52M27 56h56M27 68h42M27 80h31"/><path class="