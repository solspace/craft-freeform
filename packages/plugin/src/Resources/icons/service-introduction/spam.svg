<svg xmlns="http://www.w3.org/2000/svg" width="240" height="110" viewBox="0 0 240 110"><style>
.ff-art-spam-scan{opacity:0;animation:ff-art-spam-scan 10s ease-in-out infinite}.ff-art-spam-shield{transform-box:fill-box;transform-origin:center;animation:ff-art-spam-shield 10s ease-in-out infinite}.ff-art-spam-check{stroke-dasharray:50;stroke-dashoffset:0;animation:ff-art-spam-check 10s ease-in-out infinite}
@keyframes ff-art-spam-scan{0%{opacity:0;transform:translate(-26px,8px)}8%{opacity:1;transform:translate(-26px,8px)}20%{opacity:1;transform:translate(8px,0)}32%{opacity:1;transform:translate(-4px,20px)}44%{opacity:1;transform:translate(28px,10px)}51%,100%{opacity:0;transform:translate(28px,10px)}}
@keyframes ff-art-spam-shield{0%,48%{opacity:0;transform:scale(.94)}60%,88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes ff-art-spam-check{0%,56%{stroke-dashoffset:50;opacity:0}72%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@media(prefers-reduced-motion:reduce){.ff-art-spam-scan{animation:none;display:none}.ff-art-spam-shield,.ff-art-spam-check{animation:none}}
</style><g transform="translate(-29 0)"><rect x="30" y="17" width="130" height="76" rx="8" fill="#fff" stroke="#cbd8e8" stroke-width="1.5"/><g stroke="#b5c6d9" stroke-width="3" stroke-linecap="round"><path d="M47 35h65M47 50h92M47 65h92M47 80h49"/></g><g class="ff-art-spam-scan"><circle cx="100" cy="50" r="13" fill="#f3f8fe" stroke="#8faaca" stroke-width="2.5"/><path d="m110 60 11 11" stroke="#8faaca" stroke-width="4" stroke-linecap="round"/></g><g class="ff-art-spam-shield"><path d="m180 20 32 12v23c0 18-16 31-32 38-16-7-32-20-32-38V32l32-12Z" fill="#eaf5f0" stroke="#b9d8c9" stroke-width="1.5"/><path class="ff-art-spam-check" d="m167 55 9 9 18-21" fill="none" stroke="#74a98f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>