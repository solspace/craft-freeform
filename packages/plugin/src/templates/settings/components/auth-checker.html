<div id="auth-checker">
    <div class="status-indicator"
         data-id="{{ integration.id }}"
         data-type="{{ integration.type }}"
         data-status="pending"
         data-message-authorized="{{ "Authorized"|t('freeform') }}"
         data-message-unauthorized="{{ 'Unauthorized'|t('freeform') }}"
         data-message-pending="{{ "Checking..."|t("freeform") }}"
         data-message-error="{{ "Error"|t("freeform") }}"
    >
        <div class="status-dot"></div>
        <div class="status-message">{{ "Checking credentials..."|t("freeform") }}</div>
    </div>
    <div class="actions">
        <a data-action="refresh" class="btn small">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M463.5 224l8.5 0c13.3 0 24-10.7 24-24l0-128c0-9.7-5.8-18.5-14.8-22.2s-19.3-1.7-26.2 5.2L413.4 96.6c-87.6-86.5-228.7-86.2-315.8 1c-87.5 87.5-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2s12.5 14.8 22.2 14.8l119.5 0z"/></svg>
        </a>

        <a data-action="authorize" class="btn small">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M256 0c4.6 0 9.2 1 13.4 2.9L457.7 82.8c22 9.3 38.4 31 38.3 57.2c-.5 99.2-41.3 280.7-213.6 363.2c-16.7 8-36.1 8-52.8 0C57.3 420.7 16.5 239.2 16 140c-.1-26.2 16.3-47.9 38.3-57.2L242.7 2.9C246.8 1 251.4 0 256 0zm0 66.8l0 378.1C394 378 431.1 230.1 432 141.4L256 66.8s0 0 0 0z"/></svg>
            <span>
                {{ "Authorize"|t('freeform') }}
            </span>
        </a>
    </div>
</div>
