<svg xmlns="http://www.w3.org/2000/svg" width="240" height="110" viewBox="0 0 240 110"><style>.ff-art-email-envelope{transform-box:fill-box;transform-origin:center;animation:ff-art-email-arrive 9s cubic-bezier(.2,.7,.3,1) infinite}.ff-art-email-badge{transform-box:fill-box;transform-origin:center;animation:ff-art-email-badge 9s ease-in-out infinite}.ff-art-email-check{stroke-dasharray:30;stroke-dashoffset:0;animation:ff-art-email-check 9s ease-in-out infinite}@keyframes ff-art-email-arrive{0%{opacity:0;transform:translate(60px,0) scale(0)}24%,87%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(0,0) scale(1)}}@keyframes ff-art-email-badge{0%,32%{opacity:0;transform:scale(.8)}46%,87%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}@keyframes ff-art-email-check{0%,44%{stroke-dashoffset:30;opacity:0}62%,87%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}@media(prefers-reduced-motion:reduce){.ff-art-email-envelope,.ff-art-email-badge,.ff-art-email-check{animation:none}}</style><g class="ff-art-email-envelope"><rect x="1" y="24" width="146" height="72" rx="8" fill="var(--pane-bg, #fff)" stroke="var(--hairline-color, #cbd8e8)" stroke-width="1.5"/><path d="m3 28 62 40a17 17 0 0 0 18 0l62-40" fill="var(--secondary-pane-bg, #f6f9fd)" stroke="var(--hairline-color, #cbd8e8)" stroke-width="1.5"/><path d="m3 92 43-32m99 32-43-32" stroke="var(--hairline-color, #e1e9f3)" stroke-width="1.5"/></g><g class="ff-art-email-badge"><circle cx="144" cy="88" r="17" fill="var(--bg-success, #e5f3ec)"/><path class="ff-art-email-check" d="m136 88 5 5 10-11" fill="none" stroke="var(--fg-success, #579a7a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>