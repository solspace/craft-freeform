<svg xmlns="http://www.w3.org/2000/svg" width="240" height="110" viewBox="0 0 240 110"><style>
.ff-art-generate-bubble,.ff-art-generate-form{transform-box:fill-box;transform-origin:center}.ff-art-generate-bubble{opacity:0;animation:ff-gen-bubble 12s ease-in-out infinite}.ff-art-generate-form{animation:ff-gen-form 12s ease-in-out infinite}.ff-art-generate-line{stroke-dasharray:120;stroke-dashoffset:0;animation:ff-gen-line1 12s ease-in-out infinite}.ff-art-generate-line.two{animation-name:ff-gen-line2}.ff-art-generate-line.three{animation-name:ff-gen-line3}.ff-art-generate-button{transform-box:fill-box;transform-origin:left center;animation:ff-gen-button 12s ease-in-out infinite}.ff-art-generate-spark{transform-box:fill-box;transform-origin:center;opacity:0;animation:ff-gen-spark1 12s ease-in-out infinite}.ff-art-generate-spark.two{animation-name:ff-gen-spark2}.ff-art-generate-spark.three{animation-name:ff-gen-spark3}
@keyframes ff-gen-bubble{0%,18%{opacity:1;transform:scaleX(1)}25%{opacity:1;transform:scaleX(0)}26%,100%{opacity:0;transform:scaleX(0)}}
@keyframes ff-gen-form{0%,25%{opacity:0;transform:scaleX(0)}26%{opacity:1;transform:scaleX(0)}34%,91%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}
@keyframes ff-gen-line1{0%,35%{stroke-dashoffset:120}47%,100%{stroke-dashoffset:0}}
@keyframes ff-gen-line2{0%,45%{stroke-dashoffset:120}57%,100%{stroke-dashoffset:0}}
@keyframes ff-gen-line3{0%,55%{stroke-dashoffset:120}67%,100%{stroke-dashoffset:0}}
@keyframes ff-gen-button{0%,65%{transform:scaleX(0)}76%,100%{transform:scaleX(1)}}
@keyframes ff-gen-spark1{0%,34%,60%,100%{opacity:0;transform:scale(.5)}44%,50%{opacity:1;transform:scale(1)}}
@keyframes ff-gen-spark2{0%,53%,82%,100%{opacity:0;transform:scale(.5)}65%,72%{opacity:.85;transform:scale(1)}}
@keyframes ff-gen-spark3{0%,69%,98%,100%{opacity:0;transform:scale(.5)}80%,87%{opacity:.8;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.ff-art-generate-bubble{animation:none;display:none}.ff-art-generate-form,.ff-art-generate-line,.ff-art-generate-button,.ff-art-generate-spark{animation:none}.ff-art-generate-spark{opacity:.8}}
.ff-art-typing-dot{animation:ff-art-typing 1.4s ease-in-out infinite}.ff-art-typing-dot:nth-child(2){animation-delay:.16s}.ff-art-typing-dot:nth-child(3){animation-delay:.32s}@keyframes ff-art-typing{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-3px);opacity:1}}@media(prefers-reduced-motion:reduce){.ff-art-typing-dot{animation:none;opacity:.65}}</style><g class="ff-art-generate-bubble"><path d="M9 18h124a8 8 0 0 1 8 8v48a8 8 0 0 1-8 8H38L19 98V82H9a8 8 0 0 1-8-8V26a8 8 0 0 1 8-8Z" fill="#fff" stroke="#cbd8e8" stroke-width="1.5"/><g fill="#adc4de"><circle class="ff-art-typing-dot" cx="53" cy="50" r="4"/><circle class="ff-art-typing-dot" cx="71" cy="50" r="4"/><circle class="ff-art-typing-dot" cx="89" cy="50" r="4"/></g></g><g class="ff-art-generate-form"><rect x="1" y="8" width="140" height="94" rx="9" fill="#fff" stroke="#cbd8e8" stroke-width="1.5"/><g stroke="#d0ddef" stroke-width="3" stroke-linecap="round"><path class="ff-art-generate-line" d="M18 28h60"/><path class="ff-art-generate-line two" d="M18 47h105"/><path class="ff-art-generate-line three" d="M18 65h105"/></g><rect class="ff-art-generate-button" x="18" y="80" width="43" height="10" rx="4" fill="#dce9f7"/></g><path class="ff-art-generate-spark" d="m143 3 5 13 13 5-13 5-5 13-5-13-13-5 13-5Z" fill="#86c4df"/><path class="ff-art-generate-spark two" d="m167 54 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#c5b6e0"/><path class="ff-art-generate-spark three" d="m25 88 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#a9d1c3"/></svg>