packages:
  - "packages/*"
  - "packages/frontend/*"
  - "packages/frontend/themes/*"

overrides:
  "monaco-editor>dompurify": "3.4.17"
  "brace-expansion": "5.0.12"
  "immutable": "5.1.9"
  "shell-quote": "1.11.0"
  "source-map-js": "1.2.2"
  "follow-redirects": "1.16.1"
  "undici": "8.12.2"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "core-js-pure"

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

minimumReleaseAgeExclude:
  - react-router-dom@7.18.1
  - react-router@7.18.1
  - styled-components@6.5.2
